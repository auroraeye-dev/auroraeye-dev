<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="434" viewBox="0 0 1000 434" fill="none" role="img" aria-label="About me">
<defs>
<linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0">
  <stop id="g1" offset="0%" stop-color="#38e0c8"/>
  <stop offset="50%" stop-color="#4aa8ff"/>
  <stop id="g2" offset="100%" stop-color="#a78bfa"/>
</linearGradient>
<linearGradient id="edgeGrad" x1="0" y1="0" x2="1" y2="1">
  <stop id="e1" offset="0%" stop-color="#38e0c8" stop-opacity=".55"/>
  <stop offset="50%" stop-color="#1b2740" stop-opacity=".6"/>
  <stop id="e2" offset="100%" stop-color="#a78bfa" stop-opacity=".55"/>
</linearGradient>
<linearGradient id="panelGrad" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0%" stop-color="#0d1526"/><stop offset="100%" stop-color="#080d18"/>
</linearGradient>
<filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
  <feGaussianBlur stdDeviation="60"/></filter>
<pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
  <circle cx="1" cy="1" r="1" fill="#16203a"/></pattern>
</defs>
<style>
text{font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace}
.chrome{font-size:11.5px;fill:#63728c;letter-spacing:.4px}
.h1{font-size:22px;font-weight:700;fill:url(#nameGrad)}
.para{font-size:13.2px;fill:#9fb3cd}
.logline{font-size:12.5px;fill:#55617a;letter-spacing:1.4px}
.btitle{font-size:13.5px;font-weight:700;fill:#dbe6f5}
.bdesc{font-size:11.8px;fill:#77879f}
.rv{opacity:0;animation:rv .7s cubic-bezier(.2,.7,.3,1) both}
@keyframes rv{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
.caret{animation:blink 1.05s steps(1,end) infinite}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:.05}}
.dot{animation:pulse 3.2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
.bdot{animation:bd 3.6s ease-in-out infinite}
@keyframes bd{0%,100%{opacity:.45;r:3.2}50%{opacity:1;r:4.2}}
#g1{animation:hue 9s linear infinite}
@keyframes hue{0%{stop-color:#38e0c8}33%{stop-color:#4aa8ff}
               66%{stop-color:#a78bfa}100%{stop-color:#38e0c8}}
#g2{animation:hue2 9s linear infinite}
@keyframes hue2{0%{stop-color:#a78bfa}33%{stop-color:#38e0c8}
                66%{stop-color:#4aa8ff}100%{stop-color:#a78bfa}}
#e1{animation:hue 11s linear infinite}
#e2{animation:hue2 11s linear infinite}
</style>
<rect width="1000" height="434" rx="20" fill="#05070d"/>
<rect width="1000" height="434" rx="20" fill="url(#dots)" opacity=".5"/>
<circle cx="940" cy="30" r="200" fill="#4aa8ff" opacity=".07" filter="url(#soft)"/>
<circle cx="40" cy="434" r="200" fill="#a78bfa" opacity=".07" filter="url(#soft)"/>
<rect x="1" y="1" width="998" height="432" rx="20" fill="none" stroke="url(#edgeGrad)" stroke-width="1.5"/>
<rect x="18" y="18" width="964" height="398" rx="12" fill="url(#panelGrad)" stroke="#1e2a44"/>
<path d="M18 30 a12 12 0 0 1 12 -12 h940 a12 12 0 0 1 12 12 v16 h-964 z" fill="#111a2e"/>
<line x1="18" y1="46" x2="982" y2="46" stroke="#1e2a44"/>
<circle cx="36" cy="32.0" r="4.5" fill="#ff5f57" class="dot" style="animation-delay:0.0s"/>
<circle cx="51" cy="32.0" r="4.5" fill="#febc2e" class="dot" style="animation-delay:0.35s"/>
<circle cx="66" cy="32.0" r="4.5" fill="#28c840" class="dot" style="animation-delay:0.7s"/>
<text x="500.0" y="36.0" class="chrome" text-anchor="middle">~/about.md</text>
<rect x="38" y="65" width="0" height="28" rx="5" fill="#38e0c8" opacity=".16" class="hl"><animate attributeName="width" values="0;120;120" dur="2.4s" keyTimes="0;0.35;1" fill="freeze" begin="0.2s"/></rect>
<text x="44" y="86" class="h1 rv" style="animation-delay:.25s">About Me</text>
<text x="44" y="116" class="para rv" style="animation-delay:0.50s">I build end-to-end AI systems — from raw data pipelines to deployed,</text>
<text x="44" y="138" class="para rv" style="animation-delay:0.62s">containerised LLM applications. RAG, multi-agent workflows, computer</text>
<text x="44" y="160" class="para rv" style="animation-delay:0.74s">vision, and the unglamorous plumbing that makes them hold up in prod.</text>
<g class="rv" style="animation-delay:.95s"><text x="44" y="202" class="logline">$ cat shipped.log</text><rect x="199" y="191" width="8" height="15" rx="1.5" fill="#38e0c8" class="caret"/></g>
<g class="rv" style="animation-delay:1.15s">
<circle cx="48" cy="241" r="3.6" fill="#38e0c8" class="bdot" style="animation-delay:0.0s"/>
<text x="64" y="246" class="btitle">Basalt</text>
<text x="64" y="265" class="bdesc">AI architecture diagramming for OT/ICS + cloud,</text>
<text x="64" y="281" class="bdesc">backed by a deterministic validator.</text>
</g>
<g class="rv" style="animation-delay:1.25s">
<circle cx="517" cy="241" r="3.6" fill="#38e0c8" class="bdot" style="animation-delay:0.5s"/>
<text x="533" y="246" class="btitle">Aletheon</text>
<text x="533" y="265" class="bdesc">Drug-intelligence report generation — a RAG pipeline</text>
<text x="533" y="281" class="bdesc">tuned for source-grounding fidelity.</text>
</g>
<g class="rv" style="animation-delay:1.35s">
<circle cx="48" cy="299" r="3.6" fill="#38e0c8" class="bdot" style="animation-delay:1.0s"/>
<text x="64" y="304" class="btitle">Samcast</text>
<text x="64" y="323" class="bdesc">Gesture-based casting that moves screen content</text>
<text x="64" y="339" class="bdesc">between macOS and iPadOS. Swift.</text>
</g>
<g class="rv" style="animation-delay:1.45s">
<circle cx="517" cy="299" r="3.6" fill="#38e0c8" class="bdot" style="animation-delay:1.5s"/>
<text x="533" y="304" class="btitle">BDH Foundation LLM</text>
<text x="533" y="323" class="bdesc">Lightweight language model that reads books and</text>
<text x="533" y="339" class="bdesc">judges character-level consistency.</text>
</g>
<g class="rv" style="animation-delay:1.55s">
<circle cx="48" cy="357" r="3.6" fill="#38e0c8" class="bdot" style="animation-delay:2.0s"/>
<text x="64" y="362" class="btitle">IMC Prosperity 4</text>
<text x="64" y="381" class="bdesc">Fully self-contained, reproducible research for the</text>
<text x="64" y="397" class="bdesc">algorithmic trading competition.</text>
</g>
<g class="rv" style="animation-delay:1.65s">
<circle cx="517" cy="357" r="3.6" fill="#38e0c8" class="bdot" style="animation-delay:2.5s"/>
<text x="533" y="362" class="btitle">Always shipping</text>
<text x="533" y="381" class="bdesc">Daily DSA practice, side experiments, and whatever</text>
<text x="533" y="397" class="bdesc">the current obsession happens to be.</text>
</g>
</svg>
